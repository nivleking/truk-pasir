<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truk Pasir</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #87b5d9; }
      #app { width: 100%; height: 100%; }
      #hud { position: fixed; left: 16px; bottom: 16px; padding: 8px 12px; border-radius: 6px;
        background: rgba(0,0,0,.55); color: #fff; font: 600 14px system-ui, sans-serif; }
      #status { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); padding: 8px 14px; border-radius: 6px;
        background: rgba(0,0,0,.55); color: #fff; font: 600 15px system-ui, sans-serif; white-space: nowrap; }
      #result { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 24px 36px; border-radius: 12px;
        background: rgba(20,20,20,.85); color: #fff; font: 500 18px system-ui, sans-serif; text-align: center; line-height: 1.6; }
      #result[hidden] { display: none; }
      #result .rank { font-size: 64px; font-weight: 800; color: #e8b923; line-height: 1.1; }
      #result small { opacity: .7; }
      #result .hint { margin-top: 8px; font-size: 14px; opacity: .7; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="status"></div>
    <div id="result" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
